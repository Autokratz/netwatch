[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
version = "0.1.0"
description = "Threshold monitoring for network targets, with hysteresis and CSV history"
readme = "README.md"
requires-python = ">=3.11"   # tomllib is stdlib from 3.11
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hector Cabra" }]
keywords = ["networking", "monitoring", "icmp", "latency", "packet-loss"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6",
]

[project.scripts]
netwatch = "netwatch.cli:main"

[project.urls]
Homepage = "https://github.com/Autokratz/netwatch"
Source = "https://github.com/Autokratz/netwatch"

[tool.hatch.build.targets.wheel]
packages = ["src/netwatch"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # use pathlib
  "S",         # flake8-bandit (security)
  "BLE",       # blind except
  "RUF",       # ruff-specific
]
ignore = [
  "E501",      # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # asserts are the point of a test

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: exercises the real network or a real subprocess",
]

[tool.coverage.run]
source = ["src/netwatch"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
