name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check --diff .

      - name: Mypy (strict)
        run: mypy

  test:
    name: tests py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q --cov=netwatch --cov-report=term-missing --cov-fail-under=90

  smoke:
    name: end to end
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Version
        run: netwatch --version

      # The shipped example is the first thing a new user runs. If it stops
      # parsing, the project is broken for everyone arriving from the README.
      - name: Shipped example still parses
        run: |
          python - <<'PY'
          from pathlib import Path
          from netwatch.config import load_config
          cfg = load_config(Path("examples/netwatch.toml"))
          print(f"parsed {len(cfg.targets)} targets")
          PY

      - name: Check against loopback exits non-zero when breaching
        run: |
          cat > ci.toml <<'TOML'
          interval_s = 0.01
          window_size = 3
          [[target]]
          name = "closed-port"
          kind = "tcp"
          host = "127.0.0.1"
          port = 1
          timeout_s = 0.2
          loss_pct = 0.0
          for_breaches = 1
          clear_after = 1
          TOML
          set +e
          netwatch check -c ci.toml -n 2
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1 || { echo "expected exit 1 for a firing target"; exit 1; }

      - name: Report round-trips a history file
        run: |
          cat > ok.toml <<'TOML'
          interval_s = 0.01
          window_size = 3
          history_path = "out/history.csv"
          [[target]]
          name = "loopback"
          kind = "tcp"
          host = "127.0.0.1"
          port = 1
          timeout_s = 0.2
          # 100.0, not 99.0: comparison is strictly greater than, so total
          # loss against a closed port does not breach. This step exercises
          # history writing, not alerting.
          loss_pct = 100.0
          TOML
          netwatch run -c ok.toml -n 3 -q
          test -f out/history.csv
          netwatch report out/history.csv
